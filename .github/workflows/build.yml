name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'وسم إصدار موجود لإرفاق الملفات به (مثلا v1.2.0) — اتركه فارغا للبناء فقط'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: macos-15-intel
            cmd: dist:mac
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run ${{ matrix.cmd }} -- --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: tarabbusat-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
      # عند إنشاء إصدار بوسم v* تُرفق ملفات التنصيب به تلقائيا
      - name: إرفاق الملفات بالإصدار
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
